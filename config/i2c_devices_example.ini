########################################################################
# I2C Stress Test Vector — example format
#
# Each line defines one I2C transaction to execute repeatedly.
# The i2ctest binary sends each transaction via IPMI Master Write-Read
# (NetFn=0x06 Cmd=0x52) through the BMC to the physical I2C bus.
#
# Field format:
#   B=<bus>     I2C bus number (1-9 as digit, 10+=ASCII: :=10, ;=11...)
#   A=<addr>    I2C slave address (hex)
#   WC=<n>      number of bytes to write
#   WB1..WBn    write data bytes (register address, sub-commands)
#   RC=<n>      number of bytes to read back
#   RM1..RMn    expected read values for comparison (omit to skip compare)
#   #comment    device description (used by gen_i2ctest_ini for filtering)
#
# Lines are filtered by gen_i2ctest_ini() based on sys_conf.json:
#   - Devices absent per sys_conf are excluded (DC-ON vector)
#   - Additional DC-ON-only devices excluded for DC-OFF vector
#
# Bus encoding for buses above 9 (ASCII offset from 48):
#   Bus 10 = ':' (ASCII 58)
#   Bus 11 = ';' (ASCII 59)
#   Bus 15 = '?' (ASCII 63)
#   Bus 16 = '@' (ASCII 64)
########################################################################

# Example: FRU EEPROM on bus 1, address 0xA8
# Write register 0x00, read 4 bytes, compare against expected values
B=1 A=0xA8 WC=0x01 WB1=0x00 RC=0x04 RM1=0x01 RM2=0x00 RM3=0x00 RM4=0x01  #MB_FRU EEPROM

# Example: CPLD register read on bus 4, address 0x40 (no compare — just verify ACK)
B=4 A=0x40 WC=0x01 WB1=0x00 RC=0x01  #FAN_BOT_CPLD REG

# Example: Temperature sensor on bus 2, address 0x90
B=2 A=0x90 WC=0x01 WB1=0x00 RC=0x02  #Board_Temp_Sensor

# Example: I2C MUX select then access downstream device
# Step 1: select MUX channel 1 (write 0x01 to MUX at 0xE0)
B=1 A=0xE0 WC=0x01 WB1=0x01 RC=0x00  #PCA9548_MUX_channel_select
# Step 2: access downstream device (FRU at 0xA0 behind MUX)
B=1 A=0xA0 WC=0x01 WB1=0x00 RC=0x02  #Downstream_FRU_behind_MUX
